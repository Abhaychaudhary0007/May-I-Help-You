# Server Configuration
server.port=${PORT:8080}

# Spring Application
spring.application.name=may-i-help-you-backend

# MongoDB Configuration (Supports local MongoDB or MongoDB Atlas URI via MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/may_i_help_you}
spring.data.mongodb.auto-index-creation=true

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Multipart Limits (10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.mayihelpyou=INFO
logging.level.org.springframework.security=INFO
